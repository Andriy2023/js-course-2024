<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <p>Привіт світ</p>
    <script>
      "use strict";
      /* hvhvjjkvvv
        ghvhvjhvjvh
        hghhhvhvhh - многострочний коментарий*/
      // Ctrl + / - закоментуватиб
      // Ctrl + K, Ctrl + C comment установить
      // Ctrl + K, Ctrl + U uncomment снять комментарий
      // Alt + Shift + F - форматиуется код к стандарту записи
      alert("Hello world"); // выводит сообщение в сплывающем окне над
      // всем текстом с помощью функции alert()
      console.log("Hello world 1"); // позволяет логировать(записывать)
      // сообщение в консоль, смотреть
      // его через инструмент
      // разработчика браузера на вкладке
      // консоль, показывает в какой
      // строке кода и столбце эта запись(скрипт), функция console.log()
      console.log("Hello world 2");
      console.log("Hello world 3");
      console.log("Hello world 4");
    </script>
  </body>
</html>
